name: Update BillBot Energy + Banking database

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is always UTC. 19:00 UTC = 6:00am Melbourne (AEDT),
    # finishing well before the 7:00am BillBot web import.
    - cron: "0 19 * * *"

permissions:
  contents: write

concurrency:
  group: billbot-daily-energy-banking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out updater repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check updater
        run: python updater/run_in_cloud.py --self-test

      - name: Full Banking + Energy scan, validate and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python updater/run_in_cloud.py --publish

      - name: Show updater log on failure
        if: failure()
        run: tail -n 120 .cloud/updater.log || true
