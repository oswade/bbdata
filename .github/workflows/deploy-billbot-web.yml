name: Build and deploy standalone BillBot website

on:
  workflow_dispatch:
  push:
    branches: [main, chatgpt/billbot-web-20261024, chatgpt/billbot-ai-llm-tab-20261024, chatgpt/billbot-copy-nbn-layout-20261024, chatgpt/billbot-nbn-ai-prompts-20261024]
    paths:
      - "website-source/billbot-web.zip"
      - "website-source/billbot-web.tar.xz.b64"
      - "website-source/package.override.json"
      - "website-source/ui-overlay.tar.xz.b64"
      - "website-source/ai-llm-overlay.tar.xz.b64"
      - "website-source/apply-ui-fixes.py"
      - "website-source/nbn-ai-v5-overlay.tar.xz.b64"
      - ".github/workflows/deploy-billbot-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: billbot-pages
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Ensure full BillBot source is present
        run: |
          test -s website-source/billbot-web.tar.xz.b64 -o -s website-source/billbot-web.zip || {
            echo "::error::No standalone BillBot source archive found."
            exit 1
          }

      - name: Verify ZIP and extract separate website source
        run: |
          mkdir -p website-build
          if [ -s website-source/billbot-web.tar.xz.b64 ]; then
            base64 -d website-source/billbot-web.tar.xz.b64 > /tmp/billbot-web.tar.xz
            echo "c6e4bec2de5be38ab48cc653672e8cbf8ae0e9bbb0eaf584730c4b8bc5177a77  /tmp/billbot-web.tar.xz" | sha256sum -c -
            tar -xJf /tmp/billbot-web.tar.xz -C website-build
          else
            unzip -tq website-source/billbot-web.zip
            unzip -q website-source/billbot-web.zip -d website-build
          fi
          test -f website-build/package.json
          cp website-source/package.override.json website-build/package.json
          test -f website-build/src/lib/billbot/pricing.ts
          test -f website-build/src/lib/billbot/market-data.ts
          ! grep -RiE '(supabase\.co|lovable\.dev|lovable\.app/api)' website-build/src || {
            echo "::error::Standalone site still contains backend dependencies"
            exit 1
          }

      - name: Apply Android-inspired UI and AI upload overlay
        run: |
          set -euo pipefail
          base64 -d website-source/ui-overlay.tar.xz.b64 > /tmp/billbot-ui-overlay.tar.xz
          echo "ff04fcf13ce6f965eec757cdad19da6312a48b4ba2ed02dd518931806a49e4fb  /tmp/billbot-ui-overlay.tar.xz" | sha256sum -c -
          tar -xJf /tmp/billbot-ui-overlay.tar.xz -C website-build
          test -s website-build/src/components/billbot/ThemeToggle.tsx
          test -s website-build/src/lib/billbot/ai-bill.ts
          ! grep -q "MarketRefreshControl" website-build/src/components/billbot/Shell.tsx
          grep -q 'class="dark"' website-build/index.html
          ! grep -RilE 'lovable\.dev|supabase\.co' website-build/src/lib/billbot/market-data.ts

      - name: Apply BillBot AI/LLM feature overlay
        run: |
          set -euo pipefail
          base64 -d website-source/ai-llm-overlay.tar.xz.b64 > /tmp/billbot-ai-llm-overlay.tar.xz
          echo "f0ffb621eed1b034eb9056729455e2dbaae3135142cefce4e8bcc861ed27b540  /tmp/billbot-ai-llm-overlay.tar.xz" | sha256sum -c -
          tar -xJf /tmp/billbot-ai-llm-overlay.tar.xz -C website-build
          test -s website-build/src/routes/ai.tsx
          test -s website-build/src/lib/billbot/llm-export.test.ts
          ! grep -R 'rank-pill' website-build/src || {
            echo "::error::Old ranking number badges remain"
            exit 1
          }
          grep -q 'label: "AI/LLM"' website-build/src/components/billbot/Shell.tsx

      - name: Fix clipboard copying, NBN cost input and mobile column height
        run: |
          python website-source/apply-ui-fixes.py website-build
          test -f website-build/src/lib/billbot/clipboard.test.ts
          ! grep -q 'id="nbncur"' website-build/src/routes/nbn.tsx

      - name: Apply v5 compact NBN styling and offer-centric recurring AI prompts
        run: |
          set -euo pipefail
          base64 -d website-source/nbn-ai-v5-overlay.tar.xz.b64 > /tmp/billbot-v5-overlay.tar.xz
          echo "92098f5a2248103eae97de4e923c2ab4d76e0e591882380f19d53dcf99215a3b  /tmp/billbot-v5-overlay.tar.xz" | sha256sum -c -
          tar -xJf /tmp/billbot-v5-overlay.tar.xz -C website-build
          ! grep -q 'Lowest ongoing price' website-build/src/routes/nbn.tsx
          ! grep -q 'list-decimal' website-build/src/routes/ai.tsx
          grep -q 'HIGHEST ongoing annual interest rate' website-build/src/lib/billbot/llm-export.ts
          grep -q 'CHEAPEST ongoing standard monthly rate' website-build/src/lib/billbot/llm-export.ts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: website-build
        run: yarn install --non-interactive --no-progress

      - name: Generate typed AI route and apply TypeScript compatibility fixes
        working-directory: website-build
        env:
          VITE_BASE_PATH: /bbdata/
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("src/lib/billbot/llm-export.ts")
          s=p.read_text()
          for name in ("electricity","gas","nbn","savings"):
              s=s.replace("result."+name+" =", "result['"+name+"'] =")
          p.write_text(s)
          PY
          # Vite's TanStack Router plugin generates the strongly typed route tree.
          npm run build
          grep -q "'/ai'" src/routeTree.gen.ts

      - name: Run React and tariff tests
        working-directory: website-build
        run: npm test

      - name: TypeScript type check
        working-directory: website-build
        run: npm run lint

      - name: Production compile and static export
        working-directory: website-build
        env:
          VITE_BASE_PATH: /bbdata/
        run: npm run build

      - name: Smoke test generated index
        run: |
          test -s website-build/dist/index.html
          grep -q 'assets/' website-build/dist/index.html
          cp website-build/dist/index.html website-build/dist/404.html
          touch website-build/dist/.nojekyll

      - name: Build portable single HTML for Android
        working-directory: website-build
        env:
          VITE_BASE_PATH: ./
        run: |
          npm install --no-save --no-audit --no-fund --legacy-peer-deps vite-plugin-singlefile@2.3.0
          python - <<'PY'
          from pathlib import Path
          router=Path("src/router.tsx")
          body=router.read_text()
          body=body.replace('import { createRouter } from "@tanstack/react-router";',
                            'import { createHashHistory, createRouter } from "@tanstack/react-router";')
          body=body.replace('    basepath: import.meta.env.BASE_URL,',
                            '    basepath: "/",\n    history: createHashHistory(),')
          router.write_text(body)
          cfg=Path("vite.config.ts")
          body=cfg.read_text()
          body='import { viteSingleFile } from "vite-plugin-singlefile";\n'+body
          body=body.replace('plugins: [', 'plugins: [viteSingleFile(), ', 1)
          body=body.replace('export default defineConfig({',
                            'export default defineConfig({\n  build: { cssCodeSplit: false, rollupOptions: { output: { inlineDynamicImports: true } } },')
          cfg.write_text(body)
          PY
          npm run build
          test -s dist/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path("dist/index.html")
          html=p.read_text()
          if '<script type="module"' not in html or 'id="root"' not in html:
              raise SystemExit("Portable bundle missing required root or JavaScript")
          if 'src="/bbdata/' in html or 'href="/bbdata/' in html:
              raise SystemExit("Portable bundle still refers to hosted assets")
          print("Portable HTML size:",len(html))
          PY
          mkdir -p portable-out
          cp dist/index.html portable-out/BillBot_Android_Full.html

      - name: Upload portable Android HTML
        uses: actions/upload-artifact@v4
        with:
          name: BillBot-Android-Full-HTML
          path: website-build/portable-out/BillBot_Android_Full.html
          if-no-files-found: error

      - name: Upload checked build
        uses: actions/upload-artifact@v4
        with:
          name: billbot-static-web
          path: website-build/dist
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download checked build
        uses: actions/download-artifact@v4
        with:
          name: billbot-static-web
          path: dist
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
